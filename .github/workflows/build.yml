name: Build MatrixLauncher APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$HOME/Android/Sdk/licenses"
          printf "\n24333f8a63cbd8324867c90d4f88eab7173a0b04\nd56f5187479451eabf01fb787143c00f31f437e1\n89337d125679718437f48a1c0bdafc7e043b5dd4\n" \
            > "$HOME/Android/Sdk/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > "$HOME/Android/Sdk/licenses/android-sdk-preview-license"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename APK with version
        run: |
          VERSION="${{ github.ref_name }}"
          if [[ "$VERSION" == refs/* ]] || [[ -z "$VERSION" ]]; then VERSION="v1.0"; fi
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/MatrixLauncher-${VERSION}-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLauncher-Debug-APK
          path: app/build/outputs/apk/debug/MatrixLauncher-*-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main'
        with:
          tag_name: "v1.0"
          name: "MatrixLauncher v1.0 — Test Build"
          body: |
            ## 📱 MatrixLauncher v1.0 — Test APK

            ### How to install on your phone:
            1. Tap the **`MatrixLauncher-v1.0-debug.apk`** link below to download.
            2. When downloaded, tap **Install** (if prompted, allow *"Install unknown apps"* for your browser).
            3. Open MatrixLauncher and enjoy!

            ### Included Features:
            - ⏱️ Retro 5×7 LED dot-matrix clock + battery bar
            - 🔍 Universal search with in-line calculator (`45 * 12`)
            - ⚡ System settings deep-links (`wifi`, `battery`, `bluetooth`)
            - 📌 Dynamic app shortcuts & context menu on long-press
            - 🌤️ Weather & calendar glance
            - 📳 Haptic tactile vibration
            - ⚙️ CRT scanline shaders & custom theme colors
          files: app/build/outputs/apk/debug/MatrixLauncher-*-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build MatrixLauncher APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$HOME/Android/Sdk/licenses"
          printf "\n24333f8a63cbd8324867c90d4f88eab7173a0b04\nd56f5187479451eabf01fb787143c00f31f437e1\n89337d125679718437f48a1c0bdafc7e043b5dd4\n" \
            > "$HOME/Android/Sdk/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > "$HOME/Android/Sdk/licenses/android-sdk-preview-license"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename APK with version
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -z "$TAG" ]] || [[ "$TAG" == "main" ]] || [[ "$TAG" == "master" ]]; then
            TAG="v1.1"
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/MatrixLauncher-${TAG}-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixLauncher-Debug-APK
          path: app/build/outputs/apk/debug/MatrixLauncher-*-debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref_name == 'main'
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "MatrixLauncher ${{ steps.vars.outputs.tag_name }} — Test Build"
          body: |
            ## 📱 MatrixLauncher ${{ steps.vars.outputs.tag_name }} — Test APK

            ### How to install on your phone:
            1. Tap the **`MatrixLauncher-${{ steps.vars.outputs.tag_name }}-debug.apk`** link below to download.
            2. When downloaded, tap **Install** (if prompted, allow *"Install unknown apps"* for your browser).
            3. Open MatrixLauncher and set as default!

            ### Included Features in this Release:
            - 🛡️ **Startup Crash Fixes**: Resolved Android 14+ `registerReceiver` crash & added robust package queries.
            - 🧩 **Trendy Dot-Matrix Widgets Module**:
              - 5×7 LED Digital Clock & Date
              - Real-time Weather & Humidity LED widget
              - Hardware Telemetry (Storage, RAM, Battery % dots)
              - Quick Scratchpad sticky note
              - Calendar agenda banner
            - 🎨 **Automatic Stock App Dot-Matrix Icon Engine**:
              - 17 procedural 12×12 pixel icons for stock apps (Camera, Calculator, Clock, Dialer, Messages, Settings, Photos, Browser, Music, Calendar, Contacts, Files, Maps, Mail, Notes, Recorder, Store).
            - 🖌️ **Icon Customization Studio & PNG Image Upload**:
              - Edit any app icon: pick glyphs, change LED glow color, change dot shape.
              - **Upload custom PNG/JPEG** image from your phone's gallery!
            - 🏠 **Default Launcher Toggle & Banner**: 1-tap button to set/unset MatrixLauncher as default.
          files: app/build/outputs/apk/debug/MatrixLauncher-*-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
